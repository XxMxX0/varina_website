<!-- @tag: post-viewer | section: product-modal | interaction: swipe,order-whatsapp | images: images/<key><n>.jpg | lang: ar,en -->
<div class="viewer" id="viewer" hidden>
  <div class="viewer-head">
    <button class="viewer-close" id="viewerClose" aria-label="close"><i class="fas fa-xmark"></i></button>
    <span class="viewer-title" id="viewerTitle"></span>
    <span class="viewer-brand"><i class="fas fa-crown"></i> VARINA</span>
  </div>
  <div class="viewer-gallery" id="viewerGallery"></div>
  <div class="viewer-dots" id="viewerDots"></div>
  <div class="viewer-info">
    <p class="viewer-desc" id="viewerDesc"></p>
    <div class="viewer-meta">
      <span><i class="fas fa-heart"></i> <b id="viewerLikes">0</b></span>
      <span><i class="fas fa-images"></i> <b id="viewerCount">0</b></span>
    </div>
    <a class="viewer-order" id="viewerOrder" target="_blank" rel="noopener">
      <i class="fab fa-whatsapp"></i><span data-ar="اطلب عبر واتساب" data-en="Order via WhatsApp">اطلب عبر واتساب</span>
    </a>
  </div>
</div>
