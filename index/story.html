<!-- @tag: story | section: viewer | type: modal | instagram: iqvarin | avatar: varinaLogo | lang: ar,en -->
<div class="story-modal" id="storyModal" hidden>
  <div class="story-bars" id="storyBars"></div>
  <div class="story-head">
    <span class="story-avatar"><svg viewBox="0 0 400 400" width="34" height="34" style="border-radius:50%"><use href="#varinaLogo"/></svg></span>
    <span class="story-name">iqvarin <i class="fas fa-check-circle verified"></i></span>
    <span class="story-time" id="storyTime">الآن</span>
    <button class="story-close" id="storyClose"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="story-body">
    <span class="story-big-icon" id="storyIcon"></span>
    <p class="story-text" id="storyText"></p>
  </div>
  <button class="story-zone story-prev" id="storyPrev" aria-label="previous"></button>
  <button class="story-zone story-next" id="storyNext" aria-label="next"></button>
</div>
