<!-- @tag: settings | section: settings-modal | type: modal | music: streaming-3-sources | persist: varina-music | trigger: settingsBtn | lang: ar,en -->
<div class="settings-modal" id="settingsModal" hidden>
  <div class="settings-box">
    <div class="settings-head">
      <b class="settings-title" data-ar="الإعدادات" data-en="Settings">الإعدادات</b>
      <button type="button" class="settings-close" id="settingsClose" aria-label="close"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="settings-row">
      <span class="settings-icon"><i class="fas fa-music"></i></span>
      <div class="settings-info">
        <b data-ar="الموسيقى" data-en="Music">الموسيقى</b>
      </div>
      <button type="button" class="switch" id="musicSwitch" role="switch" aria-checked="true"><span class="knob"></span></button>
    </div>
    <p class="settings-foot">VARINA ⚜️</p>
  </div>
</div>
